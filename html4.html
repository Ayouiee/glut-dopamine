// 도파민 점수 → 별점 계산
function calcStars(d) {
  const axes = ['caption','sound','frame','rhythm','direction'];
  const score = axes.filter(a => d[a]==='O').length;
  return score; // 0~5
}

function renderStars(score, max=5) {
  let s = '';
  for(let i=0;i<score;i++) s += '★';
  for(let i=score;i<max;i++) s += '<span class="stars-empty">★</span>';
  return s;
}

function showCountryPanel(country) {
  const panel = document.getElementById('country-panel');
  const info = COUNTRY_INFO[country];
  if (!info) { panel.style.display='none'; return; }
  panel.style.display = 'block';
  let html = `<strong>${info.label}</strong><br><br>
    <table><tr><th></th><th class="col-h">${info.label}</th></tr>`;
  info.rows.forEach(r => {
    html += `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`;
  });
  html += '</table>';
  panel.innerHTML = html;
}

function getCountryGroup(c) {
  if (c === '미국' || c === '영국' || c === '글로벌') return '글로벌';
  return c;
}

function buildCard(d) {
  const stars = calcStars(d);
  const isSelected = d.selected.includes('선정') && !d.selected.includes('미선정');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.country = getCountryGroup(d.country);
  card.dataset.selected = isSelected ? 'y' : 'n';
  card.dataset.stars = stars;
  card.dataset.year = d.year;
  card.dataset.title = d.title;
  card.dataset.id = d.id;

  const imgHtml = d.img
    ? `<img src="${d.img}" alt="${d.title}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<div class=card-img-placeholder>${d.id.toString().padStart(2,'0')}</div>'">`
    : `<div class="card-img-placeholder">${d.id.toString().padStart(2,'0')}</div>`;

  const badgeClass = isSelected ? 'badge-selected' : 'badge-control';
  const badgeText = isSelected ? '선정' : '대조군';

  card.innerHTML = `
    <div class="card-img-wrap">
      ${imgHtml}
      <span class="card-duration">${d.year}</span>
    </div>
    <a class="card-title">${d.title}</a>
    <div class="card-meta">
      <div class="stars">${renderStars(stars)}</div>
      <div class="rating-count">도파민 지수 ${stars}/5 · ${stars * 20}% ratings</div>
      Added: ${d.year}<br>
      From: <span class="from">${d.broadcaster}</span><br>
      Genre: ${d.genre} · ${d.rating}<br>
      <span class="dopamine-badge ${badgeClass}">${badgeText}</span>
    </div>
  `;

  card.addEventListener('click', () => openModal(d));
  return card;
}

function openModal(d) {
  const stars = calcStars(d);
  const isSelected = d.selected.includes('선정') && !d.selected.includes('미선정');
  const imgHtml = d.img
    ? `<img id="modal-img" src="${d.img}" alt="${d.title}" style="width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid #ccc;margin-bottom:12px" onerror="this.style.background='#ddd'">`
    : `<div id="modal-img" style="width:100%;aspect-ratio:16/9;background:#e8e8e8;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;margin-bottom:12px;border:1px solid #ccc">${d.id.toString().padStart(2,'0')}</div>`;

  const axesHtml = AXES.map(a =>
    `<span class="axis-pill ${d[a]==='O'?'axis-on':'axis-off'}">${AXIS_KR[a]} ${d[a]}</span>`
  ).join('');

  document.getElementById('modal-header-title').textContent = d.title;
  document.getElementById('modal-body').innerHTML = `
    ${imgHtml}
    <div class="modal-title">${d.title}</div>
    <div class="modal-meta-row">${d.genre} · ${d.broadcaster} · ${d.year} · ${d.rating} · ${getCountryGroup(d.country)}</div>
    <div class="modal-stars">${renderStars(stars)}</div>
    <div style="font-size:11px;color:#666;margin-bottom:8px">도파민 지수 ${stars}/5 · ${stars*20}% · ${isSelected?'<span style="color:#c00">선정 콘텐츠</span>':'대조군'}</div>
    <div class="modal-section">핵심 도파민 조형 언어</div>
    <div class="modal-text">${d.desc}</div>
    <div class="modal-section">도파민 5축 분석</div>
    <div class="axes-row">${axesHtml}</div>
    <div class="modal-section">이미지화 레이어</div>
    <div class="modal-text">${d.layer}</div>
  `;
  document.getElementById('modal').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

function renderGrid(data) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  data.forEach(d => grid.appendChild(buildCard(d)));
  document.getElementById('count-display').textContent =
    `Videos 1–${data.length} of ${data.length}`;
}

function filterData(f) {
  currentFilter = f;
  if (f === 'all') return [...DATA];
  if (f === 'selected') return DATA.filter(d => d.selected.includes('선정') && !d.selected.includes('미선정'));
  if (f === '글로벌') return DATA.filter(d => ['미국','영국','글로벌'].includes(d.country));
  return DATA.filter(d => d.country === f);
}

function setTab(el, f) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const data = filterData(f);

  // 나라별 특징 패널
  if (f === '한국' || f === '일본' || f === '글로벌') {
    showCountryPanel(f);
  } else {
    document.getElementById('country-panel').style.display = 'none';
  }

  const titles = {
    all:'Most Viewed — 도파민 조형 언어 아카이브',
    한국:'한국 예능 — 자막·BGM·효과음의 레이어',
    일본:'일본 예능 — 테로프·분할화면의 과잉',
    글로벌:'글로벌 (미국·영국) — 구조를 바꾸는 편집',
    selected:'선정 콘텐츠 — 도파민 조형 언어 과잉'
  };
  document.getElementById('section-title').textContent = titles[f] || '';
  renderGrid(data);
}

function sortCards(by) {
  document.querySelectorAll('.filter-link').forEach(l => l.classList.remove('active'));
  event.target.classList.add('active');
  const data = filterData(currentFilter);
  if (by === 'stars') data.sort((a,b) => calcStars(b)-calcStars(a));
  else if (by === 'year') data.sort((a,b) => a.year-b.year);
  else if (by === 'title') data.sort((a,b) => a.title.localeCompare(b.title, 'ko'));
  else data.sort((a,b) => a.id-b.id);
  renderGrid(data);
}

function doSearch() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  if (!q) { renderGrid(filterData(currentFilter)); return; }
  const filtered = DATA.filter(d =>
    d.title.toLowerCase().includes(q) ||
    d.genre.toLowerCase().includes(q) ||
    d.broadcaster.toLowerCase().includes(q) ||
    d.desc.toLowerCase().includes(q)
  );
  renderGrid(filtered);
  document.getElementById('section-title').textContent = `"${q}" 검색 결과`;
}

document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// 초기 렌더
renderGrid(DATA);
</script>
</body>
</html>
