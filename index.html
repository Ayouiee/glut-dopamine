<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GLUT - Intro</title>
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .glut-link {
            font-family: "Times New Roman", serif;
            font-size: 15vw;
            font-weight: 0;
            color: blue;
            text-decoration: underline 5pt solid;
            text-underline-offset: 15px;
            text-underline-position: center;
            letter-spacing: -0.05em; /* 극단적인 자간 */
            transition: all 0.3s;
            cursor: pointer;
        }
        .glut-link:hover { color: red; letter-spacing: 0.5em; }
    </style>
</head>
<body>
    <a href="index.html" class="glut-link">Glut</a>
</body>
</html>
